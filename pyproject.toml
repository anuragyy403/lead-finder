[project]
name = "lead-finder"
version = "0.1.0"
description = "Find and score local business leads from Google Maps into a Google Sheet"
readme = "README.md"
authors = [
    { name = "anuragyy403", email = "250585532+anuragyy403@users.noreply.github.com" }
]
requires-python = ">=3.13"
dependencies = [
    "gspread>=6.2.1",
    "httpx>=0.28.1",
    "phonenumbers>=9.0.42",
    "pydantic>=2.14.2",
    "python-dotenv>=1.2.4",
    "selectolax>=1.0.2",
    "tenacity>=9.2.1",
]

[project.scripts]
lead-finder = "lead_finder:main"

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1.post1",
    "respx>=0.23.1",
    "ruff>=0.17.3",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
line-length = 120
